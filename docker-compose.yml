services:
  # Service 1 : Le terminal MetaTrader 5 tournant dans Docker
  mt5-terminal:
    image: jsfrnc/mt5-docker-api:latest
    container_name: mt5_terminal_container
    ports:
      - "3001:3000" # Pour accéder à l'interface de MT5 via le navigateur
      - "8001:8001" # Port de l'API Python (mt5linux)
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD}
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
    volumes:
      - mt5_data:/root/.wine/drive_c/Program Files/MetaTrader 5
    restart: unless-stopped

  # Service 2 : Ton agent Python
  agent:
    build: .
    container_name: agent_eur_usd_container
    depends_on:
      - mt5-terminal # Attend que le terminal MT5 soit lancé
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      # Indique à l'agent où trouver l'API MT5
      - MT5_HOST=mt5-terminal # Nom du service dans Docker Compose
      - MT5_PORT=8001
    volumes:
      - .:/app
      - ./logs:/app/logs # Persiste les logs sur ton disque
    command: python main.py

volumes:
  mt5_data: